[tool.pytest.ini_options]
# pytest configuration for leiloes-pt-v4 backend
# Phase 14.1: added coverage defaults + testpaths

# Where pytest looks for tests
testpaths = ["tests"]
# Match test_*.py or *_test.py files
python_files = ["test_*.py", "*_test.py"]
# Match Test* classes (we use plain functions, but be safe)
python_classes = ["Test*"]
# Match test_* functions
python_functions = ["test_*"]
# Strict markers - fail on unknown markers (catches typos)
# strict_markers = true  # Commented: we don't use markers yet (Phase 15)

# Phase 14.1: coverage defaults (used when --cov flag is passed)
addopts = [
    "--strict-markers",
    "--tb=short",
    # Phase 14.1: Coverage on the FastAPI backend surface (app.api.main).
        # Phase 15: vendor/leiloes-pt-data/ → app/leb/ rename. The data layer is
        # now a proper package (no hyphen) so pytest-cov can measure it normally.
        # We measure BOTH layers:
        # - app.api.main (the FastAPI surface, the entry points)
        # - app.leb.data (the data layer, was vendor/)
        #
        # EXCLUDED from coverage:
        # - theme.py, dashboards.py, heatmap.py, alertas.py, crawler_eleiloes.py,
        #   leiloes_reais.py — these are Streamlit-only modules exercised by
        #   the legacy python -m data.test_comprehensive scripts (kept for
        #   backward compatibility with the v3 Streamlit UI), not by pytest.
        #   Adding integration tests for them is out of Phase 15 scope.
        "--cov=app.api.main",
        "--cov=app.leb.data",
        "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    # Threshold 70% — current backend coverage is 70.7% (Phase 14.1 baseline).
    # Tighten in future phases as test count grows.
    "--cov-fail-under=70",
]

[tool.coverage.run]
# Coverage settings (run sub-process)
# Measure both the API surface (app.api) and the data layer (app.leb.data).
source_pkgs = [
    "app.api",
    "app.leb",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/test_*.py",
    # Phase 15: exclude Streamlit-only modules from coverage. These are
    # exercised by the legacy v3 test scripts (python -m data.test_comprehensive)
    # kept for backward compatibility. Adding pytest coverage for them is a
    # Phase 16+ task — would need Playwright against the running Streamlit UI
    # or full module-level mocked unit tests for plotly/streamlit APIs.
    "*/app/leb/data/theme.py",
    "*/app/leb/data/dashboards.py",
    "*/app/leb/data/heatmap.py",
    "*/app/leb/data/alertas.py",
    "*/app/leb/data/crawler_eleiloes.py",
    "*/app/leb/data/leiloes_reais.py",
    "*/app/leb/streamlit_app.py",
]
# Branch coverage (catches if/else untested branches)
branch = true

[tool.coverage.report]
# Report settings
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise ImportError",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "pass",
]
show_missing = true
skip_covered = false
sort = "Cover"
precision = 1