name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit || true
        # Allow non-blocking TS errors on existing code

      - name: Build frontend
        run: npm run build

      - name: Start API
        run: |
          npm run api &
          sleep 5

      - name: Start frontend
        run: |
          npm run dev &
          sleep 5

      - name: Run E2E tests
        run: npx playwright test --reporter=line