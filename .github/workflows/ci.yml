name: CI
true:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-pytest:
    name: Backend pytest (36 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install backend deps (including pytest)
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Run pytest with coverage
      run: PYTHONPATH="" python -m pytest tests/ -v --tb=short
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-${{ github.run_id }}
        path: 'htmlcov/

          coverage.xml

          '
        retention-days: 7
  # -----------------------------------------------------------------------------
  # Job 2: Frontend unit tests + coverage (Phase 15.1 — 36 vitest tests, fast, ~10s)
  # Validates the React/TypeScript unit-testable surface (lib/ui.tsx + tests to come).
  # Pure-function logic + brand tokens + formatters — no Leaflet, no Plotly, no
  # Playwright.  Runs in parallel with backend-pytest; both must pass before
  # backend-smoke and frontend-e2e can run (fail-fast on frontend regressions).
  #
  # PASS criterion: `npx vitest run --coverage` exits 0 with 36+ tests collected
  # and the `src/lib/ui.tsx` coverage threshold (lines 90% / branch 90%) met.
  # Falsification rule: if this job passes but the SPA breaks in production,
  # the bug is in routes/components (excluded from vitest) and Job 4 (Playwright
  # e2e) catches it.  If both pass, the unit-tested surface is verified.
  # -----------------------------------------------------------------------------
  frontend-unit:
    name: Frontend unit tests + coverage (36 vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Install frontend deps (incl. jsdom + coverage-v8)
      run: npm ci
    - name: Run vitest with coverage
      run: npx vitest run --coverage
    - name: Upload frontend coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage-${{ github.run_id }}
        path: coverage/
        retention-days: 7
  backend-smoke:
    name: Backend uvicorn smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: backend-pytest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install backend deps
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Boot uvicorn in background
      run: 'PYTHONPATH="" nohup python -m uvicorn app.api.main:app --host 127.0.0.1 --port 8001 > /tmp/uvicorn.log 2>&1 &

        echo "uvicorn PID: $!"

        sleep 4  # give it time to start

        '
    - name: Smoke /api/health
      run: "curl -fsS http://127.0.0.1:8001/api/health | tee /tmp/health.json\necho\n# Verify the JSON envelope (Phase 8 surface)\npython -c \"\nimport json, sys\ndata = json.load(open('/tmp/health.json'))\n\
        assert data.get('status') == 'ok', f'status not ok: {data}'\nassert 'version' in data, 'version missing'\nimport re\nassert re.match(r'\\d+\\.\\d+\\.\\d+', data['version']), f'version format: {data[\\\
        \"version\\\"]}'\nassert data.get('errors_total_buffered') is not None, 'buffer missing'\n# Accept int or numeric string (legacy backends may serialize differently)\nbuf = data['errors_total_buffered']\n\
        assert isinstance(buf, (int, float)) or (isinstance(buf, str) and buf.isdigit()), \\\n    f'buffer not numeric: {type(buf).__name__}={buf!r}'\nprint('PASS: /api/health OK')\n\"\n"
    - name: Smoke /api/cache/info
      run: 'curl -fsS http://127.0.0.1:8001/api/cache/info -o /dev/null -w "HTTP %{http_code}\n"

        '
    - name: Smoke /api/kpis
      run: 'curl -fsS http://127.0.0.1:8001/api/kpis -o /tmp/kpis.json

        python -c "

        import json

        data = json.load(open(''/tmp/kpis.json''))

        assert isinstance(data, dict), f''kpis must be dict, got {type(data)}''

        # At least 3 numeric KPIs expected

        numeric = sum(1 for v in data.values() if isinstance(v, (int, float)))

        assert numeric >= 3, f''expected >=3 numeric KPIs, got {numeric}: {list(data.keys())}''

        print(f''PASS: /api/kpis returned {len(data)} fields ({numeric} numeric)'')

        "

        '
    - name: Cleanup uvicorn
      if: always()
      run: 'pkill -f ''uvicorn app.api.main:app'' || true

        echo "=== Last 30 lines of uvicorn log ==="

        tail -30 /tmp/uvicorn.log || true

        '
  frontend-e2e:
    name: Frontend Playwright (58 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
    - backend-pytest
    - frontend-unit
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install backend deps
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Install frontend deps
      run: npm ci
    - name: TypeScript check
      run: npx tsc --noEmit || true
    - name: Build frontend
      run: npm run build
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: '~/.cache/ms-playwright

          ~/.cache/ms-playwright-go

          '
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: 'playwright-${{ runner.os }}-

          '
    - name: Install Playwright browsers (if not cached)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Verify Playwright cache
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright --version && echo "Cache hit, skipping browser install"
    - name: Start backend (uvicorn)
      run: 'PYTHONPATH="" nohup python -m uvicorn app.api.main:app --host 127.0.0.1 --port 8001 > /tmp/uvicorn.log 2>&1 &

        sleep 4

        curl -fsS http://127.0.0.1:8001/api/health -o /dev/null -w "API health: HTTP %{http_code}\n"

        '
    - name: Start frontend (vite dev)
      run: 'nohup npm run dev > /tmp/vite.log 2>&1 &

        sleep 8  # vite needs longer than uvicorn

        curl -fsS http://127.0.0.1:5180/ -o /dev/null -w "SPA health: HTTP %{http_code}\n"

        '
    - name: Run Playwright e2e
      run: npx playwright test --reporter=line
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
    - name: Cleanup
      if: always()
      run: 'pkill -f ''uvicorn app.api.main:app'' || true

        pkill -f ''vite'' || true

        '
